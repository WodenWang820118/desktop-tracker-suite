name: Desktop Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tooling-tests:
    name: Desktop tooling tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Setup Bun
        run: npm install -g bun@1.4.3-canary.20261019.1

      - name: Verify Node and Bun versions
        run: |
          node --version
          bun --version

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Assert lockfile unchanged
        run: git diff --exit-code -- bun.lock

      - name: Run desktop tooling tests
        run: bun run desktop:test:tooling

  verify:
    name: Verify ${{ matrix.target.desktop_target }} ${{ matrix.frontend }}+${{ matrix.backend }}
    runs-on: ${{ matrix.target.runner }}
    needs: tooling-tests
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: windows-latest
            desktop_target: windows-x64
            rust_target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            desktop_target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            desktop_target: darwin-arm64
            rust_target: aarch64-apple-darwin
        frontend:
          - ng
          - react
          - vue
        backend:
          - nest
          - express
          - spring-native

    env:
      TAURI_DESKTOP_TARGET: ${{ matrix.target.desktop_target }}
      TAURI_GRID_FRONTEND: ${{ matrix.frontend }}
      TAURI_GRID_BACKEND: ${{ matrix.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0

      - name: Setup Bun
        run: npm install -g bun@1.4.3-canary.20261019.1

      - name: Verify Node and Bun versions
        run: |
          node --version
          bun --version

      - name: Setup GraalVM for Spring native
        if: matrix.backend == 'spring-native'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Preflight Spring native toolchain
        if: matrix.backend == 'spring-native'
        run: native-image --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target.rust_target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: apps/tauri-shell/src-tauri -> target
          key: ${{ matrix.target.desktop_target }}-${{ matrix.frontend }}-${{ matrix.backend }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Assert lockfile unchanged
        run: git diff --exit-code -- bun.lock

      - name: Verify desktop grid variant
        run: bun run desktop:grid:verify:one
