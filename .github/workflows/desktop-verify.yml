name: Desktop Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.desktop_target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            desktop_target: windows-x64
          - runner: ubuntu-22.04
            desktop_target: linux-x64
          - runner: macos-latest
            desktop_target: darwin-arm64

    env:
      TAURI_DESKTOP_TARGET: ${{ matrix.desktop_target }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.desktop_target == 'windows-x64' && 'x86_64-pc-windows-msvc' || matrix.desktop_target == 'linux-x64' && 'x86_64-unknown-linux-gnu' || 'aarch64-apple-darwin' }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: apps/tauri-shell/src-tauri -> target

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop tooling tests
        run: pnpm run desktop:test:tooling

      - name: Materialize packaged backend runtime
        run: pnpm run desktop:materialize-runtime

      - name: Smoke test packaged backend runtime
        run: pnpm run desktop:smoke-runtime

      - name: Build desktop shell without bundling
        run: pnpm run desktop:build
